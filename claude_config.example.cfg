; O jeito mais fácil de ligar a IA é dentro do jogo: aperte F1 e cole a chave.
;
; Outra opção: copie este arquivo para "claude_config.cfg" (na mesma pasta do
; project.godot, ou ao lado do jogo exportado) e coloque sua chave.
; O arquivo claude_config.cfg está no .gitignore, então não vai para o GitHub.
; Também dá para usar a variável de ambiente ANTHROPIC_API_KEY.

[claude]
api_key="cole-sua-chave-aqui"
; Modelos: claude-opus-5-5 (o mais esperto), claude-sonnet-5-5 (rápido),
; claude-haiku-5-5 (o mais barato)
model="claude-opus-5-5"
